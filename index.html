<script>
"use strict";
/* ====================== 저장소: Firebase 또는 데모 ====================== */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const split=p=>p.split('/').filter(Boolean);
function getAt(o,p){for(const k of split(p)){if(o==null)return null;o=o[k]}return o===undefined?null:o}
function setAt(o,p,v){const ks=split(p);let c=o;for(let i=0;i<ks.length-1;i++){if(typeof c[ks[i]]!=='object'||c[ks[i]]===null)c[ks[i]]={};c=c[ks[i]]}
  if(v===null||v===undefined)delete c[ks[ks.length-1]];else c[ks[ks.length-1]]=JSON.parse(JSON.stringify(v))}

function demoStore(){
  const KEY='kkori-demo-db';const subs=[];
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}};
  const save=s=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
  function notify(){const s=load();for(const sub of subs){const v=getAt(s,sub.path);const str=JSON.stringify(v);if(str!==sub.last){sub.last=str;sub.cb(v==null?null:JSON.parse(str))}}}
  window.addEventListener('storage',e=>{if(e.key===KEY)notify()});
  return{demo:true,offset:0,
    async get(p){return getAt(load(),p)},
    async set(p,v){const s=load();setAt(s,p,v);save(s);setTimeout(notify,0)},
    async update(p,o){const s=load();for(const k in o)setAt(s,p+'/'+k,o[k]);save(s);setTimeout(notify,0)},
    async remove(p){const s=load();setAt(s,p,null);save(s);setTimeout(notify,0)},
    on(p,cb){const sub={path:p,cb,last:undefined};subs.push(sub);setTimeout(notify,0);return()=>{const i=subs.indexOf(sub);if(i>=0)subs.splice(i,1)}}
  };
}
async function firebaseStore(cfg){
  const V='10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
  firebase.initializeApp(cfg);const db=firebase.database();
  const st={demo:false,offset:0,
    async get(p){return (await db.ref(p).get()).val()},
    set:(p,v)=>db.ref(p).set(v),update:(p,o)=>db.ref(p).update(o),remove:p=>db.ref(p).remove(),
    on(p,cb){const r=db.ref(p);const h=r.on('value',s=>cb(s.val()));return()=>r.off('value',h)}};
  db.ref('.info/serverTimeOffset').on('value',s=>{st.offset=s.val()||0});
  return st;
}
let S; const now=()=>Date.now()+(S?S.offset:0);

/* ============================ 공통 도우미 ============================ */
const $app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
const norm=s=>String(s||'').replace(/[\s.,!?~'"()\-]/g,'').toLowerCase();
function isMatch(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||(a.length>=2&&b.length>=2&&(a.includes(b)||b.includes(a)))}

function makeCanvas(wrap){
  const W=800,H=600;const cv=document.createElement('canvas');cv.width=W;cv.height=H;wrap.appendChild(cv);
  const ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  const strokes=[];let cur=null;let color='#2B2A33',size=8,eraser=false;
  function paint(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);for(const st of strokes)drawStroke(st)}
  function drawStroke(st){ctx.strokeStyle=st.c;ctx.lineWidth=st.w;ctx.beginPath();const p=st.p;ctx.moveTo(p[0][0],p[0][1]);if(p.length===1)ctx.lineTo(p[0][0]+.1,p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke()}
  function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={c:eraser?'#fff':color,w:eraser?size*3:size,p:[pos(e)]};strokes.push(cur);drawStroke(cur)});
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();cur.p.push(pos(e));const p=cur.p;ctx.strokeStyle=cur.c;ctx.lineWidth=cur.w;ctx.beginPath();ctx.moveTo(p[p.length-2][0],p[p.length-2][1]);ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke()});
  const end=()=>{cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
  paint();
  return{
    setColor(c){color=c;eraser=false},setSize(s){size=s},setEraser(){eraser=true},
    undo(){strokes.pop();paint()},clear(){strokes.length=0;paint()},
    isEmpty:()=>strokes.length===0,
    data(){const o=document.createElement('canvas');o.width=480;o.height=360;const c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,480,360);c.drawImage(cv,0,0,480,360);return o.toDataURL('image/jpeg',.6)}
  };
}

  let unMeta=null,unDone=null,unMatch=null,unQa=null,boundRound=null;

    for(const[id,ch]of Object.entries(meta)){if(st.step>=ch.L)continue;const g=ch.group;by[g]=by[g]||{t:0,o:0};by[g].t++;if(done[`${id}_${st.step}`])by[g].o++}

  function startTick(){if(tick)return;tick=setInterval(loop,400)}

  let busy=false;
  async function loop(){
    const st=T.state;if(!st||busy)return;

      const{tot,ok}=counts();if((tot&&ok>=tot)||now()>=st.deadline)await advance(false)}
    else if(st.phase==='collect'){if(t)t.textContent='…';if(now()>=st.collectUntil){busy=true;try{await nextStep()}finally{busy=false}}}

  async function advance(){busy=true;try{if(T.state.phase==='play')await S.update(R(code)+'/state',{phase:'collect',collectUntil:now()+2500})}finally{busy=false}}
  async function nextStep(){
    const st=T.state;const s=st.step+1;

  function autoMatch(r,id){const ch=T.meta[r][id],steps=T.steps[r][id]||{};const last=steps[ch.L-1];if(T.match[r]&&T.match[r][id]!=null)return T.match[r][id];if(!last||last.type!=='word')return null;return isMatch(last.text,ch.start)}
  async function renderAlbum(){

  function albumItems(r,id){const ch=T.meta[r][id],steps=(T.steps[r]||{})[id]||{},qa=(T.qa&&T.qa[r])||{};
    const it=[{first:true,text:ch.start,label:'처음 제시어'}];

  const ownerOf=ch=>nameOf(workerOf(ch,0));
  function bubbleHTML(x){

    function finish(){

      document.getElementById('res').innerHTML=`<div class="result pop">

        <div class="row" style="justify-content:center"><span>처음과 마지막이</span><button class="match yes" id="my">일치 <span id="mky">${m===true?'✓':''}</span></button><button class="match no" id="mn">불일치 <span id="mkn">${m===false?'✓':''}</span></button></div>
        <p class="center muted" style="margin:0">어떤 정보가 빠졌거나 달라졌나요? 더 정확하게 전하려면 무엇을 덧붙이면 좋을까요?</p>
        <div class="row" style="justify-content:center"><button class="main" id="nextc">다음 친구 앨범 ▶</button></div></div>`;

          else document.getElementById('nextc').textContent='모든 앨범을 봤어요!'}};
      const t=document.querySelector(`#ct [data-c="${id}"]`);if(t&&!t.textContent.includes('✓'))t.textContent+=' ✓';
    }
    finish();
    T.album.refreshMarks=()=>{const m=autoMatch(r,id);const a=document.getElementById('mky'),b=document.getElementById('mkn');if(a){a.textContent=m===true?'✓':'';b.textContent=m===false?'✓':''}};
    function toTop(){requestAnimationFrame(()=>{const c=document.getElementById('ct');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})})}
    document.querySelectorAll('#ct [data-c]').forEach(b=>b.onclick=()=>{T.album.chain=b.dataset.c;T.album.reveal=0;renderAlbumBody()});

  async function showCompare(){

      <p class="muted" style="margin:0">2라운드가 더 잘 맞았다면, 왜 그랬을까요? AI에게도 그렇게 할 수 있을까요?</p>

/* ============================== 학생 ============================== */
function student(code,pid){
  const P={state:null,meta:null,metaRound:null,view:null,pad:null,input:null,submitted:false,unq:null,unans:null,players:{}};
  const me={group:+pid.match(/^g(\d+)_/)[1],name:nameOf(pid)};
  let tick=setInterval(timer,500);
  S.on(R(code)+'/state',v=>{if(!v){$app.innerHTML=header()+'<div class="card center"><h2>방이 끝났어요</h2></div>';return}P.state=v;route()});
  S.on(R(code)+'/players',v=>{P.players=v||{};if(P.state&&P.state.phase==='lobby')lobby()});
  async function ensureMeta(r){if(P.metaRound===r&&P.meta)return;P.meta=(await S.get(`${R(code)}/rounds/${r}/meta`))||{};P.metaRound=r}
  function myChain(s){
    const ids=Object.keys(P.meta||{});const any=ids.find(id=>P.meta[id].members.includes(pid));if(!any)return null;
    const ch0=P.meta[any];const i=ch0.members.indexOf(pid),n=ch0.n;const c=((i-s)%n+n)%n;const id=`g${ch0.group}c${c}`;return{id,ch:P.meta[id],i}}
  async function route(){
    const st=P.state;
    if(st.phase==='lobby'){if(P.view!=='lobby'){P.view='lobby';lobby()}return}
    if(st.phase==='album'){const k='album-'+st.round;if(P.view!==k){P.view=k;await ensureMeta(st.round);album()}return}
    await ensureMeta(st.round);
    const k=`play-${st.round}-${st.step}`;
    if(st.phase==='collect'&&P.view===k&&!P.submitted){await submit(true);return}
    if(P.view!==k&&st.phase==='play'){P.view=k;P.submitted=false;await play()}
  }
  function lobby(){
    const mates=Object.entries(P.players).filter(([,p])=>p.group===me.group).map(([,p])=>p.name).sort((a,b)=>String(a).localeCompare(String(b),'ko'));
    $app.innerHTML=header(`<span class="pill">${me.group}모둠 · ${esc(me.name)}</span>`)+`<div class="card stack center">${IMG.wave}<h1>곧 시작해요!</h1><p class="muted">선생님이 시작하면 화면이 바뀌어요.</p><div class="chips" style="justify-content:center">${mates.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div><p class="muted" style="margin:0">우리 모둠에 들어온 친구들</p></div>`;
  }
  function clearQ(){if(P.unq){P.unq();P.unq=null}if(P.unans){P.unans();P.unans=null}document.querySelectorAll('.modalBg.qm').forEach(x=>x.remove())}
  async function play(){
    clearQ();const st=P.state,s=st.step,mc=myChain(s);
    if(!mc){$app.innerHTML=header()+`<div class="card center stack"><h2>이번 라운드 명단에 내 이름이 없어요</h2><p class="muted" style="margin:0">처음 들어올 때와 <b>모둠·이름을 똑같이</b> 써야 이어서 할 수 있어요.<br>이번 라운드 중간에 처음 들어왔다면 다음 라운드부터 함께해요.</p><button class="main" id="rej">다시 들어가기</button></div>`;document.getElementById('rej').onclick=()=>{location.href=location.pathname+'?room='+code+'&new=1'};return}
    const{id,ch}=mc;
    if(s>=ch.L){$app.innerHTML=header(`<span class="pill">${me.group}모둠 · ${esc(me.name)}</span>`)+'<div class="card center stack">'+IMG.rocket+'<h2>우리 모둠은 끝났어요!</h2><p class="muted">다른 모둠을 기다리는 중이에요.</p></div>';return}
    const type=stepType(s);let prev=null;if(s>0)prev=await S.get(`${R(code)}/rounds/${st.round}/steps/${id}/${s-1}`);
    const prevAuthor=s>0?workerOf(ch,s-1):null;
    let top='';
    if(s===0)top=`<div class="prompt"><small>제시어</small>${esc(ch.start)}</div>`;
    else if(type==='draw')top=`<div class="prompt"><small>친구가 쓴 단어</small>${esc(prev&&prev.text||'(빈칸)')}</div>`;
    else top=`<div class="stack"><div class="prompt" style="font-size:1.3rem">친구 그림을 보고 무엇인지 단어로 써요</div>${shotHTML(prev)}</div>`;
    $app.innerHTML=header(`<span class="pill on">${st.round}라운드 · ${s+1}/${ch.L}</span><span class="pill">${me.group}모둠 · ${esc(me.name)}</span><span class="timer" id="tm" style="font-size:1.5rem"></span>`)+`
      <div class="stack" id="work">${top}<div id="qbox"></div><div id="tool" class="stack"></div>
      <div class="row" style="justify-content:center"><button class="main big" id="sb">다 했어요</button></div></div>`;
    const tool=document.getElementById('tool');
    if(type==='draw'){P.pad=drawUI(tool);P.input=null}else{P.pad=null;P.input=h('<input id="wd" maxlength="30" placeholder="무엇일까요? 단어나 짧은 말로 써요" style="font-size:1.4rem;text-align:center">');tool.appendChild(P.input);P.input.focus()}
    document.getElementById('sb').onclick=()=>submit(false);
    // 2라운드: 앞 친구에게 질문 1번
    if(st.q&&s>0&&prevAuthor){
      const qk=`${R(code)}/rounds/${st.round}/qa/${id}_${s}`;const pn=nameOf(prevAuthor);
      const qbox=document.getElementById('qbox');
      qbox.innerHTML=`<div class="qa row" style="justify-content:space-between"><span>앞 친구(${esc(pn)})에게 <b>딱 한 번</b> 물어볼 수 있어요.</span><span class="row" id="qa_in"><input id="qq" maxlength="40" placeholder="예: 몇 개야? 사람이야 동물이야?"><button id="qs">질문하기</button></span></div>`;
      document.getElementById('qs').onclick=async()=>{const v=document.getElementById('qq').value.trim();if(!v)return;await S.set(qk,{q:v,from:pid,to:prevAuthor});};
      P.unans=S.on(qk,v=>{if(!v||!v.q)return;const box=document.getElementById('qa_in');if(box)box.outerHTML=`<span><span class="q" style="color:var(--blue)">질문: ${esc(v.q)}</span><br><span style="color:var(--green)">${v.a?'대답: '+esc(v.a):'대답을 기다리는 중…'}</span></span>`;else{const sp=qbox.querySelector('.qa');if(sp)sp.innerHTML=`<span><span style="color:var(--blue)">질문: ${esc(v.q)}</span><br><span style="color:var(--green)">${v.a?'대답: '+esc(v.a):'대답을 기다리는 중…'}</span></span>`}});
    }
    // 내가 질문을 받는 쪽: 내 뒤 친구가 지금 단계에서 받은 체인 = 내가 바로 전 단계에서 만든 체인
    if(st.q&&s>0){
      const mineId=myChain(s-1).id; // s-1 단계에서 내가 작업한 체인
      const ck=P.meta[mineId];
      if(ck&&s<ck.L){
        const qk2=`${R(code)}/rounds/${st.round}/qa/${mineId}_${s}`;
        P.unq=S.on(qk2,async v=>{
          if(!v||!v.q||v.a||document.querySelector('.modalBg.qm'))return;
          const mine=await S.get(`${R(code)}/rounds/${st.round}/steps/${mineId}/${s-1}`);
          const fromN=nameOf(v.from);
          const bg=h(`<div class="modalBg qm" role="dialog" aria-label="질문 도착"><div class="modal stack"><h2>${esc(fromN)} 친구가 물어봐요!</h2><div class="qa"><span class="q">${esc(v.q)}</span></div><p class="muted" style="margin:0">내가 만든 것:</p>${shotHTML(mine)}<input id="an" maxlength="40" placeholder="짧게 대답해요"><button class="main" id="ab2">대답 보내기</button></div></div>`);
          document.body.appendChild(bg);const inp=bg.querySelector('#an');inp.focus();
          bg.querySelector('#ab2').onclick=async()=>{const a=inp.value.trim();if(!a)return;await S.update(qk2,{a});bg.remove()};
        });
      }
    }
  }
  async function submit(auto){
    if(P.submitted)return;const st=P.state,s=st.step,mc=myChain(s);if(!mc||s>=mc.ch.L)return;P.submitted=true;
    const type=stepType(s);const data={by:pid,type};
    if(type==='draw'){if(P.pad&&!P.pad.isEmpty())data.img=P.pad.data()}else{data.text=(P.input&&P.input.value.trim())||''}
    await S.set(`${R(code)}/rounds/${st.round}/steps/${mc.id}/${s}`,data);
    await S.set(`${R(code)}/rounds/${st.round}/done/${mc.id}_${s}`,true);
    const w=document.getElementById('work');if(w)w.innerHTML=`<div class="card center stack">${IMG.rocket}<h2>${auto?'시간이 끝나서 저장했어요':'잘했어요! 저장했어요'}</h2><p class="muted">모든 친구가 끝나면 다음 단계로 넘어가요.</p></div>`;
  }
  function timer(){const t=document.getElementById('tm');if(!t||!P.state||P.state.phase!=='play')return;const left=Math.max(0,Math.ceil((P.state.deadline-now())/1000));t.textContent=`${left}초`;t.classList.toggle('low',left<=10)}
  async function album(){
    clearQ();const r=P.state.round;
    const ids=Object.keys(P.meta).filter(id=>P.meta[id].group===me.group).sort((a,b)=>P.meta[a].c-P.meta[b].c);
    const all=(await S.get(`${R(code)}/rounds/${r}/steps`))||{},qa=(await S.get(`${R(code)}/rounds/${r}/qa`))||{};
    const played={};let sel=ids.find(id=>workerOf(P.meta[id],0)===pid)||ids[0],timer=null;
    const itemsOf=id=>{const ch=P.meta[id],st=all[id]||{};const it=[{first:true,text:ch.start,label:'처음 제시어'}];for(let s=0;s<ch.L;s++)it.push({kind:stepType(s),step:st[s],who:nameOf(workerOf(ch,s)),qa:qa[`${id}_${s}`]});return it};
    const bub=x=>{if(x.first)return `<div class="bub first"><small>${esc(x.label)}</small><div>${esc(x.text||'(빈칸)')}</div></div>`;
      const q=x.qa&&x.qa.q?`<div class="qa"><div class="q">질문: ${esc(x.qa.q)}</div><div class="a">${x.qa.a?'대답: '+esc(x.qa.a):'(대답 못 받음)'}</div></div>`:'';
      const b=x.kind==='draw'?(x.step&&x.step.img?`<img class="shot" alt="${esc(x.who)}의 그림" src="${x.step.img}">`:'<div class="shot ph">(시간 안에 못 그렸어요)</div>'):`<div class="say">${esc(x.step&&x.step.text||'(빈칸)')}</div>`;
      return `<div class="bub ${x.kind}"><span class="who">${esc(x.who)} ${x.kind==='draw'?'그림':'단어'}</span>${q}${b}</div>`};
    const draw=()=>{if(timer){clearInterval(timer);timer=null}
      const items=itemsOf(sel);
      $app.innerHTML=header(`<span class="pill on">${r}라운드 앨범</span><span class="pill">${me.group}모둠 · ${esc(me.name)}</span>`)+`<div class="card stack">
        <div class="tabs">${ids.map(id=>`<button data-c="${id}" class="${id===sel?'sel':''}">${esc(nameOf(workerOf(P.meta[id],0)))}의 앨범${played[id]?' ✓':''}</button>`).join('')}</div>
        <div class="stage" id="stage">${items.map(bub).join('')}</div>
        <div id="res"></div></div>`;
      played[sel]=true;{const last=items[items.length-1];const lt=last.kind==='word'?(last.step&&last.step.text||'(빈칸)'):'(그림)';
        const i2=ids.indexOf(sel);
        document.getElementById('res').innerHTML=`<div class="result"><div class="vs"><span class="b1">${esc(items[0].text||'')}</span><i>➜</i><span class="b2">${esc(lt)}</span></div>
          <p class="center muted" style="margin:0">처음과 마지막, 같았나요? 어디서 달라졌을까요?</p>
          ${i2<ids.length-1?'<div class="row" style="justify-content:center"><button class="main" id="nextc">다음 친구 앨범 ▶</button></div>':''}</div>`;
        const nc=document.getElementById('nextc');if(nc)nc.onclick=()=>{sel=ids[i2+1];draw();window.scrollTo({top:0,behavior:'smooth'})}}
      document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sel=b.dataset.c;draw()})};
    if(sel)draw();else $app.innerHTML=header()+`<div class="card center stack">${IMG.wave}<h2>TV 화면을 함께 봐요! 📺</h2></div>`;
  }
}

/* ============================== 시작 ============================== */
(async()=>{
  try{S=FIREBASE_CONFIG?await firebaseStore(FIREBASE_CONFIG):demoStore()}
  catch(e){$app.innerHTML='<div class="card"><h2>연결하지 못했어요</h2><p>인터넷 연결이나 Firebase 설정값을 확인해 주세요.</p></div>';return}
  const saved=(()=>{try{return JSON.parse(RS().get('kkori-student')||'null')}catch(e){return null}})();
  const q=new URLSearchParams(location.search);
  if(saved&&(!q.get('room')||q.get('room')===saved.code)&&!q.get('new')&&(await S.get(R(saved.code)+'/players/'+saved.pid))){student(saved.code,saved.pid);return}
  home();
})();
</script>
